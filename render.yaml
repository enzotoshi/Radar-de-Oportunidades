services:
  - type: web
    name: radar-oportunidades-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://enzotoshi.github.io,https://radar-oportunidades.onrender.com,https://radar-de-oportunidades-rho.vercel.app
      - key: GROQ_API_KEY
        sync: false
  
  # Frontend Next.js
  - type: web
    name: radar-oportunidades
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://radar-oportunidades-api.onrender.com

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build (static export)
        working-directory: frontend
        # NEXT_PUBLIC_API_URL: troque pela URL do seu backend no Render após o deploy
        # Formato: https://radar-oportunidades-api.onrender.com
        env:
          NEXT_PUBLIC_BASE_PATH: /Radar-de-Oportunidades
          NEXT_PUBLIC_API_URL: https://seu-backend.onrender.com
        run: npm run build

      - name: Add .nojekyll
        run: touch frontend/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
